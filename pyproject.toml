[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argmax"
version = "0.0.0"
description = "Accuracy-versus-compute curves from stored completions"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "polars>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/argmax"]

[tool.ruff]
line-length = 88
src = ["src", "tests", "scripts"]
# Copied byte for byte from the predecessor at tag backfire-prereg-v1.0; see
# PROVENANCE.md. Comparability with the published numbers depends on this file
# not being touched, and a formatter is a thing that touches files.
extend-exclude = [
    "src/argmax/extract/scoring_verbatim.py",
    "src/argmax/datasets/prompts_verbatim.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "falsification: asserts a pre-registered verdict; may be red by design",
    "paid: touches the network and spends credits; never runs in CI",
]
