# Second model for the MD3/MD4 replication, registered at
# argmax-prereg-margin-desc-v2.0.
#
# Same family as the first model, one generation and one size apart, not a
# cross-family replication. Every non-Qwen candidate in the 7 to 9B range
# refused serverless requests (see the pricing snapshot's gate_results).

model_slug: qwen3.5-9b
model_string: "Qwen/Qwen3.5-9B"

# Reasoning-native, sampled with the thinking phase DISABLED. Recorded as its
# own class rather than as `non_reasoning`, because what is measured here is a
# reasoning model stepped around, not a model that never had the capability.
# notes/reasoning_wall.md is the result this records.
model_class: reasoning_native_thinking_disabled

# Carried verbatim into the request body and INTO param_hash. Without it the
# model spends the whole cap inside the thinking phase: answer rate 0.0000 at
# cap 2048 and at 4096, with mean completion equal to the cap exactly.
# Together also honours `reasoning: {enabled: false}`, which probes
# indistinguishably; the model card's spelling is used because it names what
# actually changes, the chat template. Qwen3.5 dropped /think and /nothink.
request_extras:
  chat_template_kwargs:
    enable_thinking: false

params:
  temperature: 0.7        # the published setting, held so the sampling
                          # distribution is the same experiment
  top_p: null

  # NOT the published 2048. Doc 2 s7.1 keys comparability on answer rate, not
  # on cap: at 2048 with thinking off this model answers 0.8125 with 31
  # percent truncation, against the v1 reference of 0.9950. 6144 is the
  # smallest probed cap reaching it (1.0000, zero truncation). 4096 was not
  # probed with thinking off because the censored fit puts it at 0.9890.
  max_tokens: 6144

  seed: 0
  stop: []
  n: 1

  # Together's documented ceiling of 20 is wrong; 5 is the real one, found by
  # rejection on 2026-08-13. Verified again for this model by the probe.
  logprobs_depth: 5
  logprobs_style: integer_depth

concurrency: 16

pricing:
  snapshot_id: together-2026-08-14
  date: "2026-08-14"
  usd_per_1m_input: 0.17
  usd_per_1m_output: 0.25
  usd_per_1m_reasoning: null

capabilities_file: configs/models/qwen3.5-9b.capabilities.json
